# Settings for scripts/release.sh. Nothing here is secret: the signing certificate, the
# notary credentials and the private update key all stay in your keychain.

APP_NAME="Barback"

# Where the app is published. The script tells you which files to upload there.
#   $SITE_URL/appcast.xml             the update feed Barback reads
#   $SITE_URL/Barback-<version>.dmg   the download
SITE_URL="https://rhymeswithjazz.com/barback"

# The public GitHub repository (owner/name) whose releases hold the DMGs. Each release is
# published there as v<version> with its DMG, and the update feed downloads from it; only
# appcast.xml is uploaded to SITE_URL. Empty: the DMGs are uploaded to SITE_URL too.
GITHUB_REPO="rhymeswithjazz/barback"

# The Developer ID Application certificate to sign with: its name, or enough of it to pick
# out one certificate ("Developer ID Application: Your Name (TEAMID)").
SIGN_IDENTITY="Developer ID Application"

# The notarytool keychain profile, made once with:
#   xcrun notarytool store-credentials barback-notary --apple-id <you> --team-id <TEAMID>
NOTARY_PROFILE="barback-notary"

# The keychain account of the key that signs updates, made once with:
#   scripts/release.sh --make-update-key
# and the public half it prints. Every Barback you ship trusts updates signed with this
# key and no other, so back the private key up (the same command says how).
SPARKLE_ACCOUNT="barback"
SPARKLE_PUBLIC_KEY="7t3zPl7U+nyl/4Bj6AS8lPgSo+mn/EHwnm+WqEt5OUE="
